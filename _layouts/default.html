<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Both of these are load-bearing on a near-black page. `color-scheme` is what
      makes Safari paint the scrollbar, the text-selection UI and any form
      control dark; without it you get a light scrollbar down the side of a dark
      document. `theme-color` tints Safari's toolbar to the backdrop, which
      matters more here than on most sites: this page is usually opened from
      inside the app (Settings → Legal), so the browser chrome is the seam
      between the two.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F0E0B" />
    <title>
      {%- if page.url == "/" -%}{{ page.title }}{%- else -%}{{ page.title }} · {{ site.title }}{%- endif -%}
    </title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>

  <!-- `home` exists so the landing page can render its list of documents as
       cards without the markdown having to carry a class. The three published
       documents are generated files; keeping presentation out of them is what
       lets them be regenerated without thought. -->
  <body class="{% if page.url == '/' %}home{% endif %}">
    <!-- The app's ambient wash. Decorative and empty, so it is hidden from
         assistive technology entirely. -->
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}">Remedies</a>
      <nav aria-label="Legal documents">
        <!-- `nav_order` comes from the front matter `publish-legal.py` writes,
             so the current-page marker follows the same table that decides
             which files exist. Nothing here has to be kept in step by hand. -->
        <a href="{{ '/privacy' | relative_url }}"{% if page.nav_order == 1 %} aria-current="page"{% endif %}>Privacy</a>
        <a href="{{ '/terms' | relative_url }}"{% if page.nav_order == 2 %} aria-current="page"{% endif %}>Terms</a>
        <a href="{{ '/disclaimer' | relative_url }}"{% if page.nav_order == 3 %} aria-current="page"{% endif %}>Disclaimer</a>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="foot">
      <p>Remedies is an iPhone app. Settings&nbsp;→&nbsp;Legal opens these pages.</p>
      <p><a href="mailto:imdavydov@outlook.com">imdavydov@outlook.com</a></p>
    </footer>
  </body>
</html>
